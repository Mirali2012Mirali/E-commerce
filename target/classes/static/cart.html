<!DOCTYPE html>
<html>
<head>
    <title>My Cart</title>
</head>
<body>

<h1>My Cart</h1>

<div id="cart"></div>

<script>

    fetch("/api/cart")
    .then(response => response.json())
    .then(carts => {

        const container = document.getElementById("cart");

        if (carts.length === 0) {
            container.innerHTML = "<h3>Cart is empty</h3>";
            return;
        }

        carts.forEach(cart => {

            container.innerHTML += `
                <div style="border:1px solid black;padding:15px;margin:15px;">

                    <p><b>User:</b> ${cart.username}</p>

                    <p><b>Product ID:</b> ${cart.productId}</p>

                    <p><b>Quantity:</b> ${cart.quantity}</p>

                </div>
            `;

        });

    });

</script>

</body>
</html>
